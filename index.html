<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Ledger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper:#F1EEE6; --paper-deep:#E7E2D5; --card:#FBFAF6;
    --ink:#232A21; --ink-soft:#5B6156; --line:#D8D1BE; --line-soft:#E4DFD0;
    --moss:#3F5A44; --moss-deep:#2C4132; --moss-soft:#DCE4D9;
    --gold:#B4842E; --gold-deep:#8C6420; --gold-soft:#F1E3C6;
    --clay:#A8543A; --clay-soft:#EFD9CF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:'Fraunces',serif;}
  button, input, textarea, select{font-family:inherit; font-size:14px;}
  button{cursor:pointer;}
  a{color:inherit;}

  #shell{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:240px; flex-shrink:0; background:var(--paper-deep); border-right:1px solid var(--line);
    padding:24px 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:8px; margin-bottom:28px;}
  .brand-badge{width:30px; height:30px; border-radius:7px; background:var(--moss-deep); display:flex; align-items:center; justify-content:center; color:#F5F3EC; font-weight:700; font-size:14px;}
  .brand-name{font-size:21px; font-weight:600;}
  nav.navlist{display:flex; flex-direction:column; gap:2px; margin-bottom:22px;}
  .navbtn{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; border:none;
    background:transparent; font-weight:600; font-size:14px; text-align:left; color:var(--ink-soft); width:100%;
  }
  .navbtn.active{background:var(--moss-soft); color:var(--moss-deep);}
  .navbtn:hover{background:var(--line-soft);}
  .streak-box{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:auto;}
  .streak-top{display:flex; align-items:center; gap:8px; margin-bottom:4px; font-weight:700; font-size:15px;}
  .streak-sub{font-size:12.5px; color:var(--ink-soft); margin:0;}
  .reset-link{margin-top:14px; background:none; border:none; color:var(--ink-soft); font-size:12.5px; padding:6px 4px; text-align:left;}

  /* ---------- Mobile top bar ---------- */
  #mobiletop{
    display:none; position:fixed; top:0; left:0; right:0; z-index:20; background:var(--paper-deep);
    border-bottom:1px solid var(--line); padding:14px 16px; align-items:center; justify-content:space-between;
  }
  #mobilenav{display:none; position:fixed; top:53px; left:0; right:0; bottom:0; z-index:19; background:var(--paper-deep); padding:18px; overflow-y:auto;}

  /* ---------- Main ---------- */
  main{flex:1; padding:32px 28px; max-width:980px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:10px;}
  .btn-primary{background:var(--moss-deep); color:#F5F3EC; border:none; border-radius:8px; padding:10px 18px; font-weight:600;}
  .btn-primary:hover{background:var(--moss);}
  .btn-secondary{background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px 18px; font-weight:600;}
  .btn-secondary:hover{border-color:var(--ink-soft); background:var(--paper-deep);}
  .field{width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 12px; background:#fff; font-size:14px; color:var(--ink);}
  .field:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .pill{font-size:13px; padding:3px 10px; border-radius:999px; font-weight:600;}
  .progress-track{background:var(--line-soft); border-radius:999px; height:8px; width:100%; overflow:hidden;}
  .progress-fill{height:100%; transition:width .4s ease;}
  .empty-note{border:1px dashed var(--line); border-radius:8px; padding:18px; text-align:center; color:var(--ink-soft); font-size:13.5px;}

  .grid2{display:grid; grid-template-columns:1fr; gap:16px;}
  .grid3{display:grid; grid-template-columns:1fr; gap:14px;}
  @media(min-width:768px){
    .grid2{grid-template-columns:1fr 1fr;}
    .grid3{grid-template-columns:1fr 1fr 1fr;}
  }

  .statcard{padding:18px;}
  .statcard .label{font-size:12.5px; color:var(--ink-soft); margin:0; font-weight:600;}
  .statcard .value{font-size:30px; margin:4px 0; font-weight:600;}
  .statcard .sub{font-size:12.5px; color:var(--ink-soft); margin:0;}

  .chartbar-row{display:flex; align-items:flex-end; gap:8px; height:170px; padding-top:10px;}
  .chartbar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;}
  .chartbar-stack{width:100%; max-width:34px; display:flex; flex-direction:column-reverse; justify-content:flex-start; align-items:stretch; height:100%;}
  .chartbar{width:100%; border-radius:4px 4px 0 0; min-height:2px;}
  .chartbar-label{font-size:11.5px; color:var(--ink-soft);}

  .subj-card{padding:16px;}
  .subj-head{display:flex; justify-content:space-between; align-items:flex-start;}
  .icon-btn{background:transparent; border:none; color:var(--ink-soft); padding:4px;}

  .cardrow{padding:14px; display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}

  .quiz-wrap{max-width:560px; margin:0 auto;}
  .quiz-card{padding:28px; min-height:200px;}
  .opt-btn{text-align:left; display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:8px; border-radius:8px; padding:9px 12px; border:1.5px solid var(--line); background:#fff; font-size:14px;}
  .grade-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  @media(min-width:768px){ .grade-grid{grid-template-columns:repeat(4,1fr);} }
  .grade-btn{border-radius:8px; padding:9px 6px; font-weight:700; font-size:13.5px; display:flex; flex-direction:column; align-items:center; gap:2px; background:#fff;}
  .grade-btn .sub{font-weight:500; font-size:11px; opacity:.75;}

  .planner-row{display:flex; align-items:center; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--line-soft);}
  .forecast-row{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .forecast-day{width:52px; font-size:13px; color:var(--ink-soft); flex-shrink:0;}
  .forecast-count{width:24px; text-align:right; font-size:13px; font-weight:600;}

  .modal-overlay{position:fixed; inset:0; background:rgba(35,42,33,0.45); display:flex; align-items:center; justify-content:center; z-index:30; padding:20px;}
  .modal-box{padding:24px; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:10px;}

  .save-banner{background:var(--clay-soft); color:var(--clay); padding:8px 14px; border-radius:8px; font-size:13px; margin-bottom:16px;}

  form .form-row{display:flex; flex-direction:column; gap:10px;}
  .field-label{font-size:12.5px; color:var(--ink-soft); font-weight:600; display:block; margin-bottom:3px;}
  .opts-grid{display:grid; grid-template-columns:1fr; gap:8px;}
  @media(min-width:768px){ .opts-grid{grid-template-columns:1fr 1fr;} }

  .hidden{display:none !important;}

  @media(max-width:767px){
    #sidebar{display:none;}
    #mobiletop{display:flex;}
    main{padding-top:70px;}
  }
  @media(prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>
<body>

<div id="mobiletop">
  <span class="serif" style="font-size:20px; font-weight:600;">Study Ledger</span>
  <button class="btn-secondary" id="mobileNavToggle" style="padding:6px 12px;">Menu</button>
</div>
<div id="mobilenav"></div>

<div id="shell">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>

<script>
/* ======================================================================
   STUDY LEDGER — standalone vanilla JS app (no build step, no server)
   Data persists in this browser via localStorage.
====================================================================== */

const STORAGE_KEY = "study-ledger-data-v1";

const PALETTE = [
  { fg:"#3F5A44", bg:"#DCE4D9" },
  { fg:"#B4842E", bg:"#F1E3C6" },
  { fg:"#A8543A", bg:"#EFD9CF" },
  { fg:"#3D5A72", bg:"#D9E2E8" },
  { fg:"#6B4A7A", bg:"#E4DAEA" },
];
const subjectColor = (i) => PALETTE[((i % PALETTE.length) + PALETTE.length) % PALETTE.length];

/* ---------------- date helpers ---------------- */
const pad = n => String(n).padStart(2,"0");
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => toStr(new Date());
const addDays = (dateStr, n) => { const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return toStr(d); };
const dayLabel = dateStr => new Date(dateStr+"T00:00:00").toLocaleDateString(undefined,{weekday:"short"});
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------- spaced repetition (SM-2 lite) ---------------- */
function scheduleCard(card, quality){
  let { repetition, interval, ease } = card;
  if(quality < 3){ repetition = 0; interval = 1; }
  else {
    if(repetition === 0) interval = 1;
    else if(repetition === 1) interval = 6;
    else interval = Math.round(interval * ease);
    repetition += 1;
  }
  ease = Math.max(1.3, ease + (0.1 - (5-quality)*(0.08+(5-quality)*0.02)));
  ease = Math.round(ease*100)/100;
  return {
    ...card, repetition, interval, ease,
    dueDate: addDays(todayStr(), interval), lastReviewed: todayStr(),
    correctCount: card.correctCount + (quality>=3?1:0),
    wrongCount: card.wrongCount + (quality<3?1:0),
  };
}
const newCardDefaults = () => ({ repetition:0, interval:0, ease:2.5, dueDate:todayStr(), lastReviewed:null, correctCount:0, wrongCount:0 });

/* ---------------- seed data ---------------- */
function seedData(){
  const bioId = uid(), spanId = uid(), histId = uid();
  const subjects = [
    { id:bioId, name:"Biology", topic:"Cell structure & function" },
    { id:spanId, name:"Spanish", topic:"Everyday vocabulary" },
    { id:histId, name:"World History", topic:"20th century" },
  ];
  const mk = (subjectId, question, answer, options) => ({ id:uid(), subjectId, question, answer, options: options||null, ...newCardDefaults() });
  const cards = [
    mk(bioId, "What organelle produces most of a cell's ATP?", "Mitochondria", ["Golgi apparatus","Mitochondria","Ribosome","Lysosome"]),
    mk(bioId, "What structure controls what enters and leaves the cell?", "Cell membrane", ["Nucleus","Cell wall","Cell membrane","Vacuole"]),
    mk(bioId, "Name the process by which plants make glucose from sunlight.", "Photosynthesis"),
    mk(spanId, "How do you say 'library' in Spanish?", "Biblioteca", ["Biblioteca","Librería","Escuela","Oficina"]),
    mk(spanId, "Translate: 'I am hungry.'", "Tengo hambre"),
    mk(spanId, "What does 'ayer' mean?", "Yesterday", ["Tomorrow","Yesterday","Today","Always"]),
    mk(histId, "In what year did World War II end?", "1945", ["1918","1939","1945","1950"]),
    mk(histId, "What wall fell in 1989, symbolizing the end of the Cold War divide?", "The Berlin Wall"),
  ];
  return { subjects, cards, reviewLog: [], stats: { streak:0, lastActiveDate:null } };
}

/* ---------------- persistence ---------------- */
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  const seed = seedData();
  saveData(seed);
  return seed;
}
function saveData(data){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
  catch(e){ return false; }
}

/* ---------------- app state ---------------- */
let data = loadData();
let ui = { view:"dashboard", activeSubject:null, session:null, confirmReset:false, saveError:false, mobileNavOpen:false };

function persist(next){
  data = next;
  ui.saveError = !saveData(data);
  render();
}

/* ---------------- derived helpers ---------------- */
function today(){ return todayStr(); }
function dueCards(){ return data.cards.filter(c => c.dueDate <= today()); }
function dueBySubject(id){ return data.cards.filter(c => c.subjectId === id && c.dueDate <= today()); }
function masteryFor(id){
  const sc = data.cards.filter(c => c.subjectId === id);
  if(sc.length === 0) return 0;
  return Math.round((sc.filter(c => c.repetition >= 3).length / sc.length) * 100);
}
function overallMastery(){
  if(data.cards.length === 0) return 0;
  return Math.round((data.cards.filter(c => c.repetition >= 3).length / data.cards.length) * 100);
}
function last7(){
  const days = [...Array(7)].map((_,i)=>addDays(today(), -(6-i)));
  return days.map(d => {
    const entries = data.reviewLog.filter(r => r.date === d);
    return { day: dayLabel(d), reviews: entries.length, correct: entries.filter(r=>r.correct).length };
  });
}
function forecast(){
  const days = [...Array(7)].map((_,i)=>addDays(today(), i));
  return days.map((d,i) => ({ day: i===0 ? "Today" : dayLabel(d), due: data.cards.filter(c=>c.dueDate===d).length }));
}

/* ---------------- actions ---------------- */
function addSubject(name, topic){
  if(!name.trim()) return;
  persist({ ...data, subjects:[...data.subjects, { id:uid(), name:name.trim(), topic:(topic||"").trim() }] });
}
function deleteSubject(id){
  persist({ ...data, subjects:data.subjects.filter(s=>s.id!==id), cards:data.cards.filter(c=>c.subjectId!==id) });
  if(ui.activeSubject === id) ui.activeSubject = null;
}
function addCard(subjectId, question, answer, options){
  if(!question.trim() || !answer.trim()) return;
  const cleanOpts = options && options.filter(o=>o.trim()).length >= 2 ? options.map(o=>o.trim()) : null;
  const card = { id:uid(), subjectId, question:question.trim(), answer:answer.trim(), options:cleanOpts, ...newCardDefaults() };
  persist({ ...data, cards:[...data.cards, card] });
}
function deleteCard(id){ persist({ ...data, cards:data.cards.filter(c=>c.id!==id) }); }

function bumpStreak(stats){
  if(stats.lastActiveDate === today()) return stats;
  const yesterday = addDays(today(), -1);
  const streak = stats.lastActiveDate === yesterday ? stats.streak + 1 : 1;
  return { streak, lastActiveDate: today() };
}
function gradeCard(cardId, quality){
  const idx = data.cards.findIndex(c=>c.id===cardId);
  if(idx === -1) return;
  const updated = scheduleCard(data.cards[idx], quality);
  const nextCards = [...data.cards]; nextCards[idx] = updated;
  const nextLog = [...data.reviewLog, { date:today(), correct:quality>=3, cardId }];
  const nextStats = bumpStreak(data.stats);
  data = { ...data, cards:nextCards, reviewLog:nextLog, stats:nextStats }; // update without full render (session handles its own render)
  saveData(data);
}
function resetAll(){
  data = seedData(); saveData(data);
  ui = { view:"dashboard", activeSubject:null, session:null, confirmReset:false, saveError:false, mobileNavOpen:false };
  render();
}

/* ---------------- study session ---------------- */
function startStudy(subjectId){
  const pool = subjectId ? dueBySubject(subjectId) : dueCards();
  if(pool.length === 0) return;
  const shuffled = [...pool].sort(()=>Math.random()-0.5);
  ui.session = { subjectId, queue:shuffled, idx:0, showAnswer:false, picked:null, results:[], done:false };
  ui.view = "study";
  render();
}
function revealAnswer(){ ui.session.showAnswer = true; render(); }
function gradeAndAdvance(card, quality){
  gradeCard(card.id, quality);
  const s = ui.session;
  s.results[s.results.length] = quality >= 3; // record real correctness for this card
  const nextIdx = s.idx + 1;
  if(nextIdx >= s.queue.length){ s.idx = nextIdx; s.done = true; }
  else { s.idx = nextIdx; s.showAnswer = false; s.picked = null; }
  render();
}

function pickOptionFixed(opt, card){
  if(ui.session.showAnswer) return;
  const correct = opt === card.answer;
  ui.session.showAnswer = true; ui.session.picked = opt;
  render();
  setTimeout(() => {
    gradeCard(card.id, correct ? 4 : 1);
    const s = ui.session;
    s.results.push(correct);
    const nextIdx = s.idx + 1;
    if(nextIdx >= s.queue.length){ s.idx = nextIdx; s.done = true; }
    else { s.idx = nextIdx; s.showAnswer = false; s.picked = null; }
    render();
  }, 550);
}

/* ---------------- small render helpers ---------------- */
function progressBar(pct, color){
  return `<div class="progress-track"><div class="progress-fill" style="width:${Math.max(0,Math.min(100,pct))}%; background:${color};"></div></div>`;
}
function pill(text, fg, bg){ return `<span class="pill" style="color:${fg}; background:${bg};">${esc(text)}</span>`; }
function emptyNote(text){ return `<div class="empty-note">${esc(text)}</div>`; }
function iconFlame(color){ return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`; }

/* ---------------- SIDEBAR ---------------- */
const NAV_ITEMS = [
  { id:"dashboard", label:"Dashboard" },
  { id:"subjects", label:"Subjects" },
  { id:"study", label:"Study" },
  { id:"planner", label:"Planner" },
];
function sidebarHTML(){
  const s = data.stats;
  const studiedToday = s.lastActiveDate === today();
  return `
    <div class="brand"><div class="brand-badge">SL</div><span class="serif brand-name">Study Ledger</span></div>
    <nav class="navlist">
      ${NAV_ITEMS.map(item => `<button class="navbtn ${ui.view===item.id?'active':''}" data-nav="${item.id}">${esc(item.label)}</button>`).join("")}
    </nav>
    <div class="streak-box">
      <div class="streak-top">${iconFlame('#B4842E')} ${s.streak} day${s.streak===1?"":"s"}</div>
      <p class="streak-sub">${studiedToday ? "Studied today — nicely kept." : "Review something today to keep it going."}</p>
    </div>
    <button class="reset-link" id="resetBtn">Reset all data</button>
  `;
}
function renderSidebar(){
  document.getElementById("sidebar").innerHTML = sidebarHTML();
  document.getElementById("mobilenav").innerHTML = ui.mobileNavOpen ? sidebarHTML() : "";
  document.getElementById("mobilenav").style.display = ui.mobileNavOpen ? "block" : "none";
  bindSidebarEvents(document.getElementById("sidebar"));
  if(ui.mobileNavOpen) bindSidebarEvents(document.getElementById("mobilenav"));
}
function bindSidebarEvents(root){
  root.querySelectorAll("[data-nav]").forEach(btn => {
    btn.addEventListener("click", () => {
      ui.view = btn.dataset.nav;
      ui.mobileNavOpen = false;
      if(ui.view !== "subjects") ui.activeSubject = null;
      if(ui.view === "study") ui.session = null;
      render();
    });
  });
  const resetBtn = root.querySelector("#resetBtn");
  if(resetBtn) resetBtn.addEventListener("click", () => { ui.confirmReset = true; render(); });
}

/* ---------------- DASHBOARD ---------------- */
function dashboardHTML(){
  const due = dueCards().length;
  const l7 = last7(), fc = forecast();
  const maxL7 = Math.max(1, ...l7.map(d=>d.reviews));
  const maxFc = Math.max(1, ...fc.map(d=>d.due));

  const chart1 = l7.map(d => `
    <div class="chartbar-col">
      <div class="chartbar-stack" style="height:${(d.reviews/maxL7*140)||2}px;">
        <div class="chartbar" style="height:${d.reviews? (d.correct/d.reviews*100):0}%; background:var(--moss-deep);"></div>
        <div class="chartbar" style="height:${d.reviews? ((d.reviews-d.correct)/d.reviews*100):0}%; background:var(--moss-soft);"></div>
      </div>
      <span class="chartbar-label">${d.day}</span>
    </div>`).join("");

  const chart2 = fc.map(d => `
    <div class="chartbar-col">
      <div class="chartbar-stack" style="height:${(d.due/maxFc*140)||2}px;">
        <div class="chartbar" style="height:100%; background:var(--gold);"></div>
      </div>
      <span class="chartbar-label">${d.day}</span>
    </div>`).join("");

  const masteryRows = data.subjects.length === 0 ? emptyNote("No subjects yet. Head to Subjects to add your first one.") :
    data.subjects.map((s,i) => {
      const col = subjectColor(i); const pct = masteryFor(s.id);
      return `<div style="margin-bottom:14px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:13.5px;">
          <span style="font-weight:600;">${esc(s.name)}</span><span style="color:var(--ink-soft);">${pct}%</span>
        </div>
        ${progressBar(pct, col.fg)}
      </div>`;
    }).join("");

  return `
    <header style="margin-bottom:28px;">
      <h1 class="serif" style="font-size:30px; margin:0; font-weight:600;">Today's page</h1>
      <p style="color:var(--ink-soft); margin-top:6px; font-size:15px;">
        ${data.cards.length===0 ? "Add a subject and a few cards to begin your ledger." :
          due>0 ? `${due} card${due===1?"":"s"} are ready for review.` :
          "Everything is caught up — come back tomorrow, or get ahead below."}
      </p>
    </header>

    <div class="grid3" style="margin-bottom:26px;">
      <div class="card statcard" style="border-top:3px solid var(--moss-deep);">
        <p class="label">Due for review</p><p class="serif value">${due}</p>
        ${due>0 ? `<button class="btn-primary" id="studyAllBtn" style="margin-top:10px; padding:7px 14px; font-size:13px;">Start studying</button>` : ""}
      </div>
      <div class="card statcard" style="border-top:3px solid var(--gold);">
        <p class="label">Overall mastery</p><p class="serif value">${overallMastery()}%</p>
        <p class="sub">${data.cards.length} card${data.cards.length===1?"":"s"} total</p>
      </div>
      <div class="card statcard" style="border-top:3px solid var(--clay);">
        <p class="label">Current streak</p><p class="serif value">${data.stats.streak} day${data.stats.streak===1?"":"s"}</p>
        <p class="sub">Keep a card reviewed daily</p>
      </div>
    </div>

    <div class="grid2" style="margin-bottom:26px;">
      <div class="card" style="padding:18px;">
        <h3 style="margin:0; font-size:15px; font-weight:700;">Reviews, last 7 days</h3>
        <p style="font-size:12.5px; color:var(--ink-soft); margin-top:2px; margin-bottom:10px;">How much you studied each day</p>
        <div class="chartbar-row">${chart1}</div>
      </div>
      <div class="card" style="padding:18px;">
        <h3 style="margin:0; font-size:15px; font-weight:700;">What's coming due</h3>
        <p style="font-size:12.5px; color:var(--ink-soft); margin-top:2px; margin-bottom:10px;">Cards due over the next week</p>
        <div class="chartbar-row">${chart2}</div>
      </div>
    </div>

    <div class="card" style="padding:18px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="margin:0; font-size:15px; font-weight:700;">Mastery by subject</h3>
        <button class="btn-secondary" id="manageSubjectsBtn" style="padding:6px 12px; font-size:13px;">Manage subjects</button>
      </div>
      ${masteryRows}
    </div>
  `;
}
function bindDashboardEvents(){
  const b1 = document.getElementById("studyAllBtn"); if(b1) b1.addEventListener("click", ()=>startStudy(null));
  const b2 = document.getElementById("manageSubjectsBtn"); if(b2) b2.addEventListener("click", ()=>{ ui.view="subjects"; render(); });
}

/* ---------------- SUBJECTS LIST ---------------- */
function subjectsListHTML(){
  const cards = data.subjects.length === 0 ? emptyNote("You haven't added a subject yet. Use the form above to start your ledger.") :
    `<div class="grid2">${data.subjects.map((s,i) => {
      const col = subjectColor(i);
      const count = data.cards.filter(c=>c.subjectId===s.id).length;
      const pct = masteryFor(s.id);
      return `<div class="card subj-card">
        <div class="subj-head">
          <div>${pill(s.name, col.fg, col.bg)} ${s.topic ? `<p style="font-size:13px; color:var(--ink-soft); margin:8px 0 0;">${esc(s.topic)}</p>` : ""}</div>
          <button class="icon-btn" data-delsub="${s.id}" aria-label="Delete ${esc(s.name)}">✕</button>
        </div>
        <p style="font-size:13px; color:var(--ink-soft); margin:14px 0 6px;">${count} card${count===1?"":"s"} · ${pct}% mastered</p>
        ${progressBar(pct, col.fg)}
        <button class="btn-secondary" data-opensub="${s.id}" style="margin-top:14px; width:100%;">Open →</button>
      </div>`;
    }).join("")}</div>`;

  return `
    <header style="margin-bottom:22px;">
      <h1 class="serif" style="font-size:28px; margin:0; font-weight:600;">Subjects</h1>
      <p style="color:var(--ink-soft); margin-top:6px; font-size:15px;">Group your cards by subject, then open one to add material.</p>
    </header>
    <form id="addSubjectForm" class="card" style="padding:16px; margin-bottom:22px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
      <div style="flex:1 1 180px;"><label class="field-label">Subject name</label><input class="field" name="name" placeholder="e.g. Chemistry"></div>
      <div style="flex:1 1 220px;"><label class="field-label">Current focus (optional)</label><input class="field" name="topic" placeholder="e.g. Periodic trends"></div>
      <button type="submit" class="btn-primary">+ Add subject</button>
    </form>
    ${cards}
  `;
}
function bindSubjectsListEvents(){
  const form = document.getElementById("addSubjectForm");
  if(form) form.addEventListener("submit", e => {
    e.preventDefault();
    const name = form.name.value, topic = form.topic.value;
    addSubject(name, topic);
  });
  document.querySelectorAll("[data-opensub]").forEach(b => b.addEventListener("click", () => { ui.activeSubject = b.dataset.opensub; render(); }));
  document.querySelectorAll("[data-delsub]").forEach(b => b.addEventListener("click", () => deleteSubject(b.dataset.delsub)));
}

/* ---------------- SUBJECT DETAIL ---------------- */
let detailFormState = { useOptions:false };
function subjectDetailHTML(subject){
  const cards = data.cards.filter(c=>c.subjectId===subject.id);
  const due = dueBySubject(subject.id).length;
  const optsBlock = detailFormState.useOptions ? `
    <div class="opts-grid">
      ${[0,1,2,3].map(i => `<input class="field" name="opt${i}" placeholder="Option ${i+1}${i===0?" (include the answer exactly)":""}">`).join("")}
    </div>` : "";

  const cardRows = cards.length === 0 ? emptyNote("No cards yet — add your first one above.") :
    `<div style="display:flex; flex-direction:column; gap:8px;">${cards.map(c => `
      <div class="card cardrow">
        <div>
          <p style="margin:0; font-size:14px; font-weight:600;">${esc(c.question)}</p>
          <p style="margin:4px 0 0; font-size:13px; color:var(--ink-soft);">
            ${esc(c.answer)}${c.options ? " · multiple-choice" : ""} · due ${c.dueDate===today() ? "today" : (c.dueDate<today() ? "overdue" : c.dueDate)}
          </p>
        </div>
        <button class="icon-btn" data-delcard="${c.id}" aria-label="Delete card">✕</button>
      </div>`).join("")}</div>`;

  return `
    <button class="btn-secondary" id="backToSubjects" style="margin-bottom:18px; padding:7px 12px; font-size:13px;">← All subjects</button>
    <header style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; margin-bottom:22px;">
      <div>
        <h1 class="serif" style="font-size:28px; margin:0; font-weight:600;">${esc(subject.name)}</h1>
        ${subject.topic ? `<p style="color:var(--ink-soft); margin-top:4px; font-size:14px;">${esc(subject.topic)}</p>` : ""}
      </div>
      ${due>0 ? `<button class="btn-primary" id="studySubjectBtn">Study ${due} due card${due===1?"":"s"}</button>` : ""}
    </header>

    <form id="addCardForm" class="card" style="padding:18px; margin-bottom:22px;">
      <h3 style="margin:0 0 12px; font-size:15px; font-weight:700;">Add a card</h3>
      <div class="form-row">
        <div><label class="field-label">Question</label><textarea class="field" name="question" rows="2" placeholder="What do you want to be asked?"></textarea></div>
        <div><label class="field-label">Answer</label><input class="field" name="answer" placeholder="The correct answer"></div>
        <label style="font-size:13px; display:flex; align-items:center; gap:7px; color:var(--ink-soft); font-weight:600;">
          <input type="checkbox" id="useOptionsCheck" ${detailFormState.useOptions?"checked":""}> Make this multiple-choice
        </label>
        ${optsBlock}
        <div><button type="submit" class="btn-primary">+ Add card</button></div>
      </div>
    </form>

    <h3 style="font-size:15px; font-weight:700; margin-bottom:10px;">Cards (${cards.length})</h3>
    ${cardRows}
  `;
}
function bindSubjectDetailEvents(subject){
  document.getElementById("backToSubjects").addEventListener("click", () => { ui.activeSubject = null; detailFormState.useOptions=false; render(); });
  const studyBtn = document.getElementById("studySubjectBtn");
  if(studyBtn) studyBtn.addEventListener("click", () => startStudy(subject.id));
  document.getElementById("useOptionsCheck").addEventListener("change", (e) => { detailFormState.useOptions = e.target.checked; render(); });
  const form = document.getElementById("addCardForm");
  form.addEventListener("submit", e => {
    e.preventDefault();
    const question = form.question.value, answer = form.answer.value;
    let options = null;
    if(detailFormState.useOptions){
      options = [0,1,2,3].map(i => form[`opt${i}`] ? form[`opt${i}`].value : "");
    }
    addCard(subject.id, question, answer, options);
    detailFormState.useOptions = false;
  });
  document.querySelectorAll("[data-delcard]").forEach(b => b.addEventListener("click", () => deleteCard(b.dataset.delcard)));
}

/* ---------------- STUDY VIEW ---------------- */
function studyChooserHTML(){
  const due = dueCards();
  if(due.length === 0){
    return `
      <header style="margin-bottom:22px;">
        <h1 class="serif" style="font-size:28px; margin:0; font-weight:600;">Study</h1>
        <p style="color:var(--ink-soft); margin-top:6px; font-size:15px;">Choose what to review. Cards you've marked as easy come back less often.</p>
      </header>
      ${emptyNote("Nothing is due right now. Add more cards, or check back later.")}
    `;
  }
  const bySubject = data.subjects.map((s,i) => {
    const count = due.filter(c=>c.subjectId===s.id).length;
    if(count===0) return "";
    const col = subjectColor(i);
    return `<button class="card" data-studysub="${s.id}" style="padding:14px; text-align:left; display:flex; justify-content:space-between; align-items:center;">
      <span>${pill(s.name, col.fg, col.bg)} <span style="font-size:13px; color:var(--ink-soft); margin-left:8px;">${count} due</span></span>
      <span>→</span>
    </button>`;
  }).join("");

  return `
    <header style="margin-bottom:22px;">
      <h1 class="serif" style="font-size:28px; margin:0; font-weight:600;">Study</h1>
      <p style="color:var(--ink-soft); margin-top:6px; font-size:15px;">Choose what to review. Cards you've marked as easy come back less often.</p>
    </header>
    <button class="btn-primary" id="studyAllBtn2" style="margin-bottom:14px;">✦ Study all due cards (${due.length})</button>
    <div class="grid2">${bySubject}</div>
  `;
}
function studySessionHTML(){
  const s = ui.session;
  if(s.done){
    const correct = s.results.filter(Boolean).length;
    return `
      <div style="max-width:460px; margin:40px auto 0; text-align:center;">
        <h2 class="serif" style="font-size:24px; margin:0 0 8px;">Session complete</h2>
        <p style="color:var(--ink-soft); margin-bottom:18px;">You got ${correct} of ${s.results.length} right this round.</p>
        <button class="btn-primary" id="backToStudy">Back to study</button>
      </div>`;
  }
  const card = s.queue[s.idx];
  const subjIdx = data.subjects.findIndex(x=>x.id===card.subjectId);
  const subject = data.subjects[subjIdx];
  const col = subjectColor(Math.max(subjIdx,0));

  let body;
  if(card.options){
    body = card.options.map(opt => {
      let style = `border-color:var(--line); background:#fff;`;
      let mark = "";
      if(s.showAnswer){
        if(opt === card.answer){ style = `border-color:var(--moss-deep); background:var(--moss-soft);`; mark = `<span style="color:var(--moss-deep);">✓</span>`; }
        else if(opt === s.picked){ style = `border-color:var(--clay); background:var(--clay-soft);`; mark = `<span style="color:var(--clay);">✕</span>`; }
      }
      return `<button class="opt-btn" data-pick="${esc(opt)}" style="${style}" ${s.showAnswer?"disabled":""}>${esc(opt)} ${mark}</button>`;
    }).join("");
  } else if(!s.showAnswer){
    body = `<button class="btn-secondary" id="revealBtn">Show answer</button>`;
  } else {
    body = `
      <p style="font-size:16px; background:var(--paper-deep); padding:10px 14px; border-radius:8px; margin-bottom:18px;">${esc(card.answer)}</p>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;">How well did you know it?</p>
      <div class="grade-grid">
        <button class="grade-btn" data-grade="0" style="border:1.5px solid var(--clay); color:var(--clay);">Again<span class="sub">0d</span></button>
        <button class="grade-btn" data-grade="3" style="border:1.5px solid #8C6420; color:#8C6420;">Hard<span class="sub">soon</span></button>
        <button class="grade-btn" data-grade="4" style="border:1.5px solid var(--moss-deep); color:var(--moss-deep);">Good<span class="sub">on track</span></button>
        <button class="grade-btn" data-grade="5" style="border:1.5px solid #3D5A72; color:#3D5A72;">Easy<span class="sub">longer</span></button>
      </div>`;
  }

  return `
    <div class="quiz-wrap">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        ${pill(subject ? subject.name : "Card", col.fg, col.bg)}
        <span style="font-size:13px; color:var(--ink-soft);">${s.idx+1} of ${s.queue.length}</span>
      </div>
      <div class="card quiz-card">
        <p class="serif" style="font-size:22px; font-weight:500; margin:0 0 20px; line-height:1.4;">${esc(card.question)}</p>
        ${body}
      </div>
    </div>
  `;
}
function bindStudyEvents(){
  const b1 = document.getElementById("studyAllBtn2"); if(b1) b1.addEventListener("click", ()=>startStudy(null));
  document.querySelectorAll("[data-studysub]").forEach(b => b.addEventListener("click", ()=>startStudy(b.dataset.studysub)));
}
function bindStudySessionEvents(){
  const s = ui.session;
  if(s.done){ document.getElementById("backToStudy").addEventListener("click", ()=>{ ui.session=null; render(); }); return; }
  const card = s.queue[s.idx];
  const revealBtn = document.getElementById("revealBtn");
  if(revealBtn) revealBtn.addEventListener("click", revealAnswer);
  document.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => pickOptionFixed(b.dataset.pick, card)));
  document.querySelectorAll("[data-grade]").forEach(b => b.addEventListener("click", () => gradeAndAdvance(card, Number(b.dataset.grade))));
}

/* ---------------- PLANNER ---------------- */
function plannerHTML(){
  const overdue = data.cards.filter(c=>c.dueDate < today()).length;
  const subjRows = data.subjects.length === 0 ? emptyNote("Add a subject to start planning your study days.") :
    data.subjects.map((s,i) => {
      const due = dueBySubject(s.id).length; const col = subjectColor(i);
      return `<div class="planner-row">
        ${pill(s.name, col.fg, col.bg)}
        <div style="display:flex; align-items:center; gap:12px;">
          <span style="font-size:13px; color:var(--ink-soft);">${due} due</span>
          ${due>0 ? `<button class="btn-secondary" data-studysub="${s.id}" style="padding:5px 12px; font-size:12.5px;">Study</button>` : ""}
        </div>
      </div>`;
    }).join("");

  const fc = forecast();
  const outlookRows = fc.map(f => `
    <div class="forecast-row">
      <span class="forecast-day">${f.day}</span>
      <div style="flex:1;">${progressBar(Math.min(100, f.due*12), "var(--gold)")}</div>
      <span class="forecast-count">${f.due}</span>
    </div>`).join("");

  return `
    <header style="margin-bottom:22px;">
      <h1 class="serif" style="font-size:28px; margin:0; font-weight:600;">Planner</h1>
      <p style="color:var(--ink-soft); margin-top:6px; font-size:15px;">
        ${overdue>0 ? `${overdue} card${overdue===1?" is":"s are"} overdue — those come first.` : "Here's what's ahead this week."}
      </p>
    </header>
    <div class="card" style="padding:18px; margin-bottom:20px;">
      <h3 style="margin:0 0 12px; font-size:15px; font-weight:700;">Due today, by subject</h3>
      ${subjRows}
    </div>
    <div class="card" style="padding:18px;">
      <h3 style="margin:0 0 4px; font-size:15px; font-weight:700;">Seven-day outlook</h3>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:0; margin-bottom:12px;">How your review load is spread out</p>
      ${outlookRows}
    </div>
  `;
}
function bindPlannerEvents(){
  document.querySelectorAll("[data-studysub]").forEach(b => b.addEventListener("click", ()=>startStudy(b.dataset.studysub)));
}

/* ---------------- MODAL ---------------- */
function renderModal(){
  const root = document.getElementById("modalRoot");
  if(!ui.confirmReset){ root.innerHTML = ""; return; }
  root.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box">
        <h3 class="serif" style="font-size:20px; margin-bottom:8px;">Reset the ledger?</h3>
        <p style="font-size:14px; color:var(--ink-soft); margin-bottom:18px;">This clears every subject, card, and review record, and restores the starter set. This can't be undone.</p>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button class="btn-secondary" id="cancelReset">Cancel</button>
          <button class="btn-primary" id="confirmReset" style="background:var(--clay);">Reset everything</button>
        </div>
      </div>
    </div>`;
  document.getElementById("cancelReset").addEventListener("click", ()=>{ ui.confirmReset=false; render(); });
  document.getElementById("confirmReset").addEventListener("click", resetAll);
}

/* ---------------- MAIN RENDER ---------------- */
function render(){
  renderSidebar();
  const main = document.getElementById("main");
  let html = "";
  if(ui.saveError) html += `<div class="save-banner">Couldn't save your last change. It's kept for this session, but try again in a moment.</div>`;

  if(ui.view === "dashboard"){ html += dashboardHTML(); main.innerHTML = html; bindDashboardEvents(); }
  else if(ui.view === "subjects" && !ui.activeSubject){ html += subjectsListHTML(); main.innerHTML = html; bindSubjectsListEvents(); }
  else if(ui.view === "subjects" && ui.activeSubject){
    const subject = data.subjects.find(s=>s.id===ui.activeSubject);
    if(!subject){ ui.activeSubject=null; return render(); }
    html += subjectDetailHTML(subject); main.innerHTML = html; bindSubjectDetailEvents(subject);
  }
  else if(ui.view === "study" && !ui.session){ html += studyChooserHTML(); main.innerHTML = html; bindStudyEvents(); }
  else if(ui.view === "study" && ui.session){ html += studySessionHTML(); main.innerHTML = html; bindStudySessionEvents(); }
  else if(ui.view === "planner"){ html += plannerHTML(); main.innerHTML = html; bindPlannerEvents(); }

  renderModal();
}

/* ---------------- mobile nav toggle ---------------- */
document.getElementById("mobileNavToggle").addEventListener("click", () => {
  ui.mobileNavOpen = !ui.mobileNavOpen;
  document.getElementById("mobileNavToggle").textContent = ui.mobileNavOpen ? "Close" : "Menu";
  render();
});

render();
</script>
</body>
</html>
